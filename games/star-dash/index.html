<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星轨疾行</title>
  <link rel="stylesheet" href="./game.css">
  <script type="module" src="./game.js"></script>
</head>
<body>
  <p id="load-status" role="status">正在载入游戏…</p>
  <main id="game" hidden>
    <p id="flight-time"></p>
    <div class="scene">
      <canvas width="360" height="520" aria-hidden="true"></canvas>
      <div id="menu" class="menu">
        <h1 data-text="title"></h1>
        <p id="instruction" data-text="instruction"></p>
        <p id="result" aria-live="polite" hidden></p>
        <button id="start" type="button" data-text="start"></button>
      </div>
    </div>
    <div class="controls">
      <button id="left" type="button" data-text="left" disabled></button>
      <button id="right" type="button" data-text="right" disabled></button>
    </div>
  </main>
</body>
</html>
