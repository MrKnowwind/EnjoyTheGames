name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify game rules and localization
        run: |
          node --test
          node scripts/check-locales.mjs games/hyper-tiltvexa/locales
          node scripts/check-locales.mjs games/star-dash/locales

      - uses: actions/configure-pages@v5

      - name: Assemble the static site
        run: |
          mkdir _site
          cp index.html play.html catalog.js lobby.js player.js styles.css _site/
          cp -r assets games _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      # Pages may briefly return an empty artifact list after upload succeeds.
      - name: Allow the Pages artifact to become visible
        run: sleep 15

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
